# BROKEN: runs as root + allowPrivilegeEscalation (TATAR-CON-002, TATAR-CON-003)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: root-app
  namespace: production
  labels: { app: root-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: root-app } }
  template:
    metadata: { labels: { app: root-app } }
    spec:
      containers:
        - name: app
          image: busybox:1.36.1
          command: ["sleep", "3600"]
          securityContext:
            runAsNonRoot: false               # <-- TATAR-CON-002
            allowPrivilegeEscalation: true    # <-- TATAR-CON-003
