# BROKEN: wildcard RBAC permissions (TATAR-RBAC-002)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: too-powerful
rules:
  - apiGroups: ["*"]     # <-- TATAR-RBAC-002
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: too-powerful-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: production
roleRef:
  kind: ClusterRole
  name: too-powerful
  apiGroup: rbac.authorization.k8s.io
