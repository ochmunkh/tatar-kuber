# BROKEN: privileged container (TATAR-CON-001)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-app
  namespace: production
  labels: { app: privileged-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: privileged-app } }
  template:
    metadata: { labels: { app: privileged-app } }
    spec:
      containers:
        - name: app
          image: nginx:1.25.3
          securityContext:
            privileged: true          # <-- TATAR-CON-001
