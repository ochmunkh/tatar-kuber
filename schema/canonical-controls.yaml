# schema/canonical-controls.yaml
# TATAR Canonical Control Registry v1.0 (bilingual: en/mn)
# title, remediation нь {en, mn}. Get(lang) нь lang->en->аль нэг руу fallback хийнэ.
# Canonical ID = IMMUTABLE CONTRACT. scanner rule ID-ууд PROVISIONAL.

schema_version: '1.0'
last_updated: '2026-07-24'
categories:
- id: CON
  name: Container Security
- id: RBAC
  name: RBAC & Authorization
- id: NET
  name: Network Security
- id: IMG
  name: Image Security
- id: SEC
  name: Secret Management
- id: OPS
  name: Operational Health
controls:
- id: TATAR-CON-001
  title:
    en: Privileged container enabled
    mn: Эрх нэмэгдүүлсэн (privileged) контейнер
  category: Container Security
  type: misconfiguration
  default_severity: HIGH
  status: active
  description: Container privileged=true эрхтэй ажиллаж, node-ийн бүх төхөөрөмжид хандах боломжтой.
  remediation:
    en: Set securityContext.privileged=false.
    mn: securityContext.privileged=false болгоно.
  references:
  - CIS-5.2.1
  - MITRE-T1611
  mappings:
    trivy:
    - AVD-KSV0017
    kubescape:
    - C-0057
    checkov:
    - CKV_K8S_16
    popeye: []
  blind_shot_rules:
  - namespace: kube-system
    resource_match: calico-node
    reason: Known Kubernetes CNI networking component
    downgrade_to: INFO
- id: TATAR-CON-002
  title:
    en: Container running as root
    mn: Root эрхээр ажиллаж буй контейнер
  category: Container Security
  type: misconfiguration
  default_severity: MEDIUM
  status: active
  description: Container UID 0 (root)-оор ажиллаж байна.
  remediation:
    en: Set securityContext.runAsNonRoot=true.
    mn: securityContext.runAsNonRoot=true тохируулна.
  references:
  - CIS-5.2.6
  mappings:
    trivy:
    - AVD-KSV0012
    kubescape:
    - C-0013
    checkov:
    - CKV_K8S_23
