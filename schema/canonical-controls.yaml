    title: "Missing readiness probe"
    category: "Operational Health"
    type: hygiene
    default_severity: LOW
    status: active
    description: "readinessProbe тодорхойлоогүй."
    remediation: "readinessProbe нэмнэ."
    references: []
    mappings:
      trivy:     []
      kubescape: ["C-0018"]
      checkov:   ["CKV_K8S_9"]
      popeye:    ["POP-102"]

  - id: TATAR-OPS-002
    title: "Missing liveness probe"
    category: "Operational Health"
    type: hygiene
    default_severity: LOW
    status: active
    description: "livenessProbe тодорхойлоогүй."
    remediation: "livenessProbe нэмнэ."
    references: []
    mappings:
      trivy:     []
      kubescape: ["C-0018"]
      checkov:   ["CKV_K8S_8"]
      popeye:    ["POP-103"]

  - id: TATAR-OPS-003
    title: "Orphan / dead service (no endpoints)"
    category: "Operational Health"
    type: hygiene
    default_severity: INFO
    status: active
    description: "Service-д тохирох endpoint байхгүй."
    remediation: "Service-ийг устгах эсвэл selector-ыг засна."
    references: []
    mappings:
      trivy:     []
      kubescape: []
      checkov:   []
      popeye:    ["POP-1102"]

  - id: TATAR-OPS-004
    title: "Unused ConfigMap / Secret"
    category: "Operational Health"
    type: hygiene
    default_severity: INFO
    status: active
    description: "Ашиглагдаагүй ConfigMap эсвэл Secret."
    remediation: "Ашиглагдаагүй объектыг устгана."
    references: []
    mappings:
      trivy:     []
      kubescape: []
      checkov:   []
      popeye:    ["POP-400", "POP-401"]

  - id: TATAR-OPS-005
    title: "imagePullPolicy not set correctly"
    category: "Operational Health"
    type: hygiene
    default_severity: LOW
    status: active
    description: "imagePullPolicy тохируулаагүй эсвэл буруу."
    remediation: "imagePullPolicy-г IfNotPresent/Always болгож тодорхой заана."
    references: []
    mappings:
      trivy:     []
      kubescape: []
      checkov:   ["CKV_K8S_15"]
      popeye:    ["POP-106"]
